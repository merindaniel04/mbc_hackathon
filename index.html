<!-- 
/*******************************************************************************
 * STREETLIGHT ALERT SYSTEM (HACKATHON PROTOTYPE)
 * * This is a single-file, full-featured web application prototype designed
 * for a hackathon environment. It simulates a three-role management system
 * without requiring a backend server.
 * * CORE TECHNOLOGIES:
 * 1. HTML: Structure of the application.
 * 2. Tailwind CSS: Styling and professional, responsive design.
 * 3. JavaScript: All application logic, state management, and page rendering.
 * * DATA PERSISTENCE:
 * - Data (users, reports, status) is stored in the browser's localStorage.
 * * KEY FEATURES:
 * - Role-Based Access: Citizen, Worker, and Authority logins.
 * - OTP Simulation: Realistic login flow for Citizens.
 * - Citizen Reporting: Submit damaged light reports and new light requests.
 * - Worker Management: View assigned tasks, **SORTED BY PRIORITY**, and update status.
 * - Authority Oversight: View global reports, assign tasks/priority to workers, and edit report status.
 * - **MAJOR UPDATE**: Citizen reporting now includes **Priority** selection (Low/Medium/High) as user input.
 * - **DUPLICATION CHECK**: Report submission is rejected if the Pole ID already exists in a 'New' or 'In Progress' complaint.
 * - **FIX**: Corrected Worker Dashboard button to pass Pole ID as a string, fixing the 'Start Work' button functionality.
 *******************************************************************************/
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streetlight Alert App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            color: #1f2937;
            /* DEEP TEAL GRADIENT FOR ELEGANCE - slightly richer for a classic feel */
            background: linear-gradient(135deg, #0d5f57 0%, #178a7c 100%);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            /* Stronger shadow and a subtle border for a classic, framed look */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 10px 20px -8px rgba(0, 0, 0, 0.15);
            border: 1px solid #e5e7eb; /* Light border for definition */
        }
        .btn {
            padding: 0.85rem 1.5rem; 
            border-radius: 0.75rem;
            font-weight: 800; 
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
        }
        /* Primary Teal Button */
        .btn-primary {
            background-color: #0f766e; 
            color: white;
        }
        .btn-primary:hover {
            background-color: #14b8a6;
            transform: translateY(-1px); 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }
        .btn-secondary {
            background-color: #e5e7eb;
            color: #4b5563;
            font-weight: 700; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-secondary:hover {
            background-color: #d1d5db;
        }
        .form-input {
            padding: 0.75rem 1rem;
            font-size: 1.125rem; 
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-input:focus {
            outline: none;
            border-color: #14b8a6; 
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.5);
        }
        .tag-status {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px; 
            font-weight: 700;
            font-size: 0.75rem;
        }
        .tag-priority {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px; 
            font-weight: 700;
            font-size: 0.75rem;
        }
        .role-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .role-card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px -8px rgba(15, 118, 110, 0.4);
        }
        h1, h2 {
             font-weight: 900; /* Super Extra-bold headers */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div id="app-container" class="w-full max-w-2xl">
    <!-- Content will be dynamically rendered here -->
</div>

<script>
    // --- Data Storage and State Management ---
    // Use localStorage to simulate a database for the hackathon
    let userRole = localStorage.getItem('userRole') || null;
    let isLoggedIn = localStorage.getItem('isLoggedIn') === 'true'; // New state variable
    let complaints = JSON.parse(localStorage.getItem('complaints')) || [];
    let requests = JSON.parse(localStorage.getItem('requests')) || [];
    // let nextPoleId = parseInt(localStorage.getItem('nextPoleId')) || 1001; // Pole ID is now user input
    
    // Global state for logged-in user details
    let currentCitizen = JSON.parse(localStorage.getItem('currentCitizen')) || null;
    let currentWorker = JSON.parse(localStorage.getItem('currentWorker')) || null;
    let currentAuthority = JSON.parse(localStorage.getItem('currentAuthority')) || null;
    
    let otpTimer = null; // Timer for OTP countdown

    // User data for a simple sign-up system
    let citizens = JSON.parse(localStorage.getItem('citizens')) || [{ username: 'citizen_user', phoneNumber: '9876543210' }];
    let workers = JSON.parse(localStorage.getItem('workers')) || [{ workerId: 'W123', phoneNumber: '1234567890', password: 'password123' }, { workerId: 'W124', phoneNumber: '1234567891', password: 'password124' }];
    let authorities = JSON.parse(localStorage.getItem('authorities')) || [{ authorityId: 'A456', username: 'auth_admin', password: 'adminpassword' }];

    function saveState() {
        localStorage.setItem('userRole', userRole);
        localStorage.setItem('isLoggedIn', isLoggedIn);
        localStorage.setItem('complaints', JSON.stringify(complaints));
        localStorage.setItem('requests', JSON.stringify(requests));
        // localStorage.setItem('nextPoleId', nextPoleId); // Removed
        localStorage.setItem('citizens', JSON.stringify(citizens));
        localStorage.setItem('workers', JSON.stringify(workers));
        localStorage.setItem('authorities', JSON.stringify(authorities));
        localStorage.setItem('currentCitizen', JSON.stringify(currentCitizen));
        localStorage.setItem('currentWorker', JSON.stringify(currentWorker));
        localStorage.setItem('currentAuthority', JSON.stringify(currentAuthority));
    }

    // --- Utility Functions for Styling ---
    function getStatusTag(status) {
        let color = '';
        if (status === 'Completed') color = 'bg-green-100 text-green-700';
        else if (status === 'In Progress') color = 'bg-yellow-100 text-yellow-700';
        else if (status === 'New' || status === 'Requested') color = 'bg-blue-100 text-blue-700';
        else color = 'bg-gray-100 text-gray-700';
        return `<span class="tag-status ${color}">${status}</span>`;
    }

    function getPriorityTag(priority) {
        let color = '';
        if (priority === 'High') color = 'bg-red-100 text-red-700';
        else if (priority === 'Medium') color = 'bg-yellow-100 text-yellow-700';
        else if (priority === 'Low') color = 'bg-green-100 text-green-700';
        else color = 'bg-gray-100 text-gray-700';
        return `<span class="tag-priority ${color}">${priority || 'N/A'}</span>`;
    }

    // --- UI Rendering Functions ---
    const appContainer = document.getElementById('app-container');

    // Updated SVG logo with a right-shifted light cone, color is now set by text-indigo-700 (which will reflect in the code as a dark text color)
    const logoSvg = `<svg class="h-16 w-16 mx-auto mb-4 text-[#0f766e]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Pole -->
        <line x1="50" y1="95" x2="50" y2="15" stroke="currentColor" stroke-width="6" />
        <!-- Arm -->
        <line x1="50" y1="15" x2="75" y2="15" stroke="currentColor" stroke-width="6" />
        <!-- Lamp Housing -->
        <rect x="68" y="10" width="15" height="10" rx="2" fill="currentColor" />
        <!-- Light Cone, now shifted more to the right -->
        <polygon points="75,20 110,95 40,95" fill="yellow" opacity="0.6" />
    </svg>`;

    function renderLoginPage() {
        appContainer.innerHTML = `
            <div class="card text-center shadow-2xl">
                ${logoSvg}
                <h1 class="text-4xl font-extrabold text-teal-700 mb-2">Streetlight Alert</h1>
                <p class="text-lg text-gray-600 mb-8 font-semibold">Efficiently report and manage city infrastructure repairs.</p>
                <h2 class="text-2xl font-extrabold text-gray-700 mb-6">Select Your Access Portal</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="selectRole('citizen')" class="role-card p-6 bg-cyan-50 text-cyan-800 border border-cyan-200 rounded-xl shadow-md hover:bg-cyan-100">
                        <span class="text-4xl block mb-2">🚶‍♂️</span>
                        <span class="text-xl font-extrabold">Citizen</span>
                        <p class="text-sm text-cyan-600 mt-1 font-medium">Report Issues & Track Status</p>
                    </button>
                    <button onclick="selectRole('worker')" class="role-card p-6 bg-teal-50 text-teal-800 border border-teal-200 rounded-xl shadow-md hover:bg-teal-100">
                        <span class="text-4xl block mb-2">👷</span>
                        <span class="text-xl font-extrabold">Worker</span>
                        <p class="text-sm text-teal-600 mt-1 font-medium">Receive & Resolve Assigned Tasks</p>
                    </button>
                    <button onclick="selectRole('authority')" class="role-card p-6 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl shadow-md hover:bg-emerald-100">
                        <span class="text-4xl block mb-2">🏛️</span>
                        <span class="text-xl font-extrabold">Authority</span>
                        <p class="text-sm text-emerald-600 mt-1 font-medium">Manage Priorities & Oversight</p>
                    </button>
                </div>
            </div>
        `;
    }
    
    // Renders the intermediate login/signup page
    function renderLoginOrSignupPage(role) {
        appContainer.innerHTML = `
            <div class="card text-center shadow-lg">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-6">${role.charAt(0).toUpperCase() + role.slice(1)} Access Portal</h1>
                <p class="text-gray-600 mb-8 font-medium">Select an option to proceed.</p>
                <div class="flex flex-col space-y-4">
                    <button onclick="renderCorrectForm('login')" class="btn btn-primary w-full py-3 text-lg">Login</button>
                    <button onclick="renderCorrectForm('signup')" class="btn btn-secondary w-full py-3 text-lg">Sign Up</button>
                </div>
                <button onclick="logout()" class="btn btn-secondary mt-4 w-full py-3 text-lg">Back to Role Selection</button>
            </div>
        `;
    }

    // Directs to the correct login or signup form based on user's choice
    function selectRole(role) {
      userRole = role;
      isLoggedIn = false; // Reset login state
      saveState();
      renderLoginOrSignupPage(role);
    }
    
    function renderCorrectForm(action) {
        if (action === 'login') {
            if (userRole === 'citizen') renderCitizenLoginForm();
            else if (userRole === 'worker') renderWorkerLoginForm();
            else if (userRole === 'authority') renderAuthorityLoginForm();
        } else if (action === 'signup') {
            if (userRole === 'citizen') renderCitizenSignupForm();
            else if (userRole === 'worker') renderWorkerSignupForm();
            else if (userRole === 'authority') renderAuthoritySignupForm();
        }
    }

    // --- Login Forms ---
    function renderCitizenLoginForm() {
        // Ensure OTP timer is cleared if navigating from OTP page
        if (otpTimer) clearInterval(otpTimer);
        
        appContainer.innerHTML = `
            <div class="card shadow-2xl">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Citizen Login 🚶‍♂️</h1>
                <p class="text-sm text-gray-500 mb-6 text-center font-medium">Verify your identity to submit and track reports.</p>
                <form id="login-form" class="space-y-6">
                    <input type="hidden" name="role" value="citizen">
                    
                    <div class="relative">
                        <input type="text" id="username" name="username" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="username" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Username</label>
                    </div>

                    <div class="relative">
                        <input type="tel" id="phoneNumber" name="phoneNumber" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="phoneNumber" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Phone Number</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-full py-3 text-lg">Verify & Login</button>
                </form>
                <button onclick="renderLoginOrSignupPage('citizen')" class="btn btn-secondary mt-4 w-full py-3 text-lg">Back</button>
            </div>
        `;
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    }

    // New OTP verification page
    function renderOtpVerificationPage() {
        // Clear any existing timer
        if (otpTimer) clearInterval(otpTimer);
        let timeLeft = 60;
        
        appContainer.innerHTML = `
            <div class="card shadow-2xl">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Secure OTP Verification</h1>
                <p class="text-gray-600 mb-6 text-center text-sm font-medium">A 6-digit verification code has been sent to your device.</p>
                <form id="otp-form" class="space-y-6">
                    <div class="relative">
                        <input type="text" id="otp" name="otp" maxlength="6" class="form-input text-center peer pt-5 pb-2 tracking-widest" placeholder=" " required>
                        <label for="otp" class="absolute left-1/2 -translate-x-1/2 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Enter OTP</label>
                    </div>
                    <div class="text-center text-sm font-bold" id="timer-display">Time left: 60s</div>
                    <button type="submit" id="verify-btn" class="btn btn-primary w-full py-3 text-lg">Verify Code</button>
                </form>
                <button id="back-to-login-btn" class="btn btn-secondary mt-4 w-full py-3 text-lg">Back to Login</button>
            </div>
        `;
        document.getElementById('otp-form').addEventListener('submit', handleOtpVerification);
        
        // --- FIX: Add event listener to clear timer on back button ---
        document.getElementById('back-to-login-btn').addEventListener('click', () => {
            if (otpTimer) clearInterval(otpTimer);
            otpTimer = null;
            renderCitizenLoginForm();
        });


        // Start the countdown timer
        const timerDisplay = document.getElementById('timer-display');
        const verifyBtn = document.getElementById('verify-btn');
        
        otpTimer = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = `Time left: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(otpTimer);
                otpTimer = null; // Important: reset global variable
                verifyBtn.disabled = true;
                verifyBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
                verifyBtn.classList.remove('btn-primary');
                timerDisplay.textContent = "Time expired. Please try again.";
            }
        }, 1000);
    }


    function renderWorkerLoginForm() {

                    </div>

                        <input type="password" id="password" name="password" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="password" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Password</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-full py-3 text-lg">Secure Login</button>
                </form>
                <button onclick="renderLoginOrSignupPage('worker')" class="btn btn-secondary mt-4 w-full py-3 text-lg">Back</button>
            </div>
        `;
        document.getElementById('login-form').addEventListener('submit', handleLogin);

    function renderAuthorityLoginForm() {
        appContainer.innerHTML = `
            <div class="card shadow-2xl">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Authority Login 🏛️</h1>
                <p class="text-sm text-gray-500 mb-6 text-center font-medium">Access global oversight and priority management tools.</p>

                    <input type="hidden" name="role" value="authority">

                    </div>

                        <label for="username" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Username</label>
                    </div>

                    <div class="relative">
                        <input type="password" id="password" name="password" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="password" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Password</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-full py-3 text-lg">Secure Login</button>
                </form>
                <button onclick="renderLoginOrSignupPage('authority')" class="btn btn-secondary mt-4 w-full py-3 text-lg">Back</button>
            </div>
        `;
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    }

    // --- Sign Up Forms ---
    function renderCitizenSignupForm() {
        appContainer.innerHTML = `
            <div class="card shadow-2xl">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Citizen Sign Up 🚶‍♂️</h1>
                <p class="text-sm text-gray-500 mb-6 text-center font-medium">Create a new account to report issues quickly.</p>
                <form id="signup-form" class="space-y-6">
                    <input type="hidden" name="role" value="citizen">
                    
                    <div class="relative">
                        <input type="text" id="username" name="username" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="username" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Username</label>
                    </div>

                        <label for="phoneNumber" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Phone Number</label>

    function renderAuthoritySignupForm() {
        appContainer.innerHTML = `
            <div class="card shadow-2xl">
                ${logoSvg}
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Authority Sign Up 🏛️</h1>
                <p class="text-sm text-gray-500 mb-6 text-center font-medium">Register your management credentials.</p>
                <form id="signup-form" class="space-y-6">
                    <input type="hidden" name="role" value="authority">
                    
                    <div class="relative">
                        <input type="text" id="authorityId" name="authorityId" class="form-input peer pt-5 pb-2" placeholder=" " required>
                        <label for="authorityId" class="absolute left-3 top-1 text-sm text-gray-500 transition-all transform origin-top-left peer-placeholder-shown:text-lg peer-placeholder-shown:top-3 peer-focus:text-sm peer-focus:top-1 peer-focus:text-teal-600">Authority ID</label>

    function getGeolocation() {
        const locationInput = document.getElementById('location');
        const originalPlaceholder = locationInput.placeholder;
        locationInput.value = '';
        locationInput.placeholder = 'Fetching location...';
        locationInput.disabled = true;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    locationInput.value = `Lat: ${lat.toFixed(6)}, Lon: ${lon.toFixed(6)}`;
                    locationInput.placeholder = originalPlaceholder;
                    locationInput.disabled = false;
                    showMessage("Location fetched successfully!");
                },
                (error) => {
                    locationInput.value = '';
                    locationInput.placeholder = originalPlaceholder;
                    locationInput.disabled = false;
                    showMessage("Could not get location. Please enter manually.");
                }
            );
        } else {
            locationInput.value = '';
            locationInput.placeholder = originalPlaceholder;
            locationInput.disabled = false;
            showMessage("Geolocation is not supported by this browser. Please enter manually.");
        }
    }

    // --- Application Logic Functions ---
    function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const role = form.role.value;

        if (role === 'citizen') {
            const username = form.username.value;
            const phoneNumber = form.phoneNumber.value;
            const user = citizens.find(u => u.username === username && u.phoneNumber === phoneNumber);
            if (user) {
                currentCitizen = user; // Store the logged-in citizen
                saveState(); // Save the current citizen state
                showMessage("OTP sent successfully!");
                renderOtpVerificationPage();
            } else {
                showMessage("Invalid username or phone number. Please try again.");
            }
        } else if (role === 'worker') {
            const workerId = form.workerId.value;
            const phoneNumber = form.phoneNumber.value;
            const password = form.password.value;
            const user = workers.find(u => u.workerId === workerId && u.phoneNumber === phoneNumber && u.password === password);
            if (user) {
                isLoggedIn = true;
                currentWorker = user; // Store the logged-in worker
                saveState();
                renderApp();
            } else {
                showMessage("Invalid credentials. Please try again.");
            }
        } else if (role === 'authority') {
            const authorityId = form.authorityId.value;
            const username = form.username.value;
            const password = form.password.value;
            const user = authorities.find(u => u.authorityId === authorityId && u.username === username && u.password === password);
            if (user) {
                isLoggedIn = true;
                currentAuthority = user;
                saveState();
                renderApp();
            } else {
                showMessage("Invalid credentials. Please try again.");
            }
        }
    }
    
    // New function to handle OTP verification
    function handleOtpVerification(event) {
        event.preventDefault();
        const form = event.target;
        const enteredOtp = form.otp.value;
        const correctOtp = '123456'; // Hardcoded for prototype

        if (enteredOtp === correctOtp) {
            isLoggedIn = true;
            saveState();
            renderApp();
            showMessage("Login successful!");
        } else {
            showMessage("Invalid OTP. Please try again.");
        }
    }

    function handleSignup(event) {
        event.preventDefault();
        const form = event.target;
        const role = form.role.value;
        let newUser = {};
        let userExists = false;

        if (role === 'citizen') {
            const username = form.username.value;
            const phoneNumber = form.phoneNumber.value;
            userExists = citizens.some(u => u.username === username || u.phoneNumber === phoneNumber);
            newUser = { username, phoneNumber };
            if (!userExists) {
                citizens.push(newUser);
                currentCitizen = newUser;
            }
        } else if (role === 'worker') {
            const workerId = form.workerId.value;
            const phoneNumber = form.phoneNumber.value;
            const password = form.password.value;
            userExists = workers.some(u => u.workerId === workerId || u.phoneNumber === phoneNumber);
            newUser = { workerId, phoneNumber, password };
            if (!userExists) {
                workers.push(newUser);
                currentWorker = newUser;
            }
        } else if (role === 'authority') {
            const authorityId = form.authorityId.value;
            const username = form.username.value;
            const password = form.password.value;
            userExists = authorities.some(u => u.authorityId === authorityId || u.username === username);
            newUser = { authorityId, username, password };
            if (!userExists) {
                authorities.push(newUser);
                currentAuthority = newUser;
            }
        }

        if (userExists) {
            showMessage("An account with this ID/username/phone number already exists. Please login.");
        } else {
            saveState();
            isLoggedIn = true;
            showMessage("Sign up successful! Logging you in...");
            renderApp();
        }
    }

    function logout() {
        userRole = null;
        isLoggedIn = false;
        currentCitizen = null;
        currentWorker = null;
        currentAuthority = null;
        saveState();
        renderApp();
    }

    function handleReportSubmit(event) {
        event.preventDefault();
        const form = event.target;

        // Safely get form values
        const locationInput = form.querySelector('[name="location"]');
        const descriptionInput = form.querySelector('[name="description"]');
        const typeInput = form.querySelector('[name="reportType"]');
        const poleIdInput = form.querySelector('[name="poleId"]'); // Get Pole ID input
        const priorityInput = form.querySelector('[name="priority"]'); // Get Priority input

        if (!locationInput || !descriptionInput || !typeInput) {
            showMessage("Error: Form inputs not found. Please try again.");
            return;
        }

        const location = locationInput.value;
        const description = descriptionInput.value;
        const type = typeInput.value;
        const poleId = poleIdInput ? poleIdInput.value.trim() : null; // Get Pole ID or null
        const priority = priorityInput ? priorityInput.value : 'Low'; // Get Priority or default to Low for new requests

        // Ensure currentCitizen exists before accessing its properties
        if (!currentCitizen) {
            showMessage("Error: User details not found. Please log in again.");
            renderLoginPage();
            return;
        }

        if (type === 'damage') {
            // --- NEW DUPLICATION CHECK AND VALIDATION FOR POLE ID ---
            if (!poleId) {
                 showMessage("Error: Pole ID is required for damaged light reports.");
                 return;
            }

            const existingComplaint = complaints.find(c => 
                c.poleId === poleId && (c.status === 'New' || c.status === 'In Progress')
            );

            if (existingComplaint) {
                showMessage(`Report rejected. Pole ID ${poleId} is already reported and currently ${existingComplaint.status.toLowerCase()}.`);
                renderCitizenDashboard();
                return;
            }

            const newComplaint = {
                id: Date.now(),
                poleId: poleId, // Use user-input Pole ID
                location,
                description,
                status: 'New',
                date: new Date().toLocaleDateString(),
                type: 'damage',
                reportedBy: currentCitizen.username,
                priority: priority // Use citizen-provided priority
            };
            complaints.push(newComplaint);
        } else {
            // New Light Request (no Pole ID needed)
            const newRequest = {
                id: Date.now(),
                location,
                description,
                status: 'Requested',
                date: new Date().toLocaleDateString(),
                type: 'new',
                reportedBy: currentCitizen.username,
                priority: 'Low' // Default to Low for new light request until authority reviews
            };
            requests.push(newRequest);
        }
        
        saveState();
        renderCitizenDashboard();
        showMessage('Report submitted successfully! Check your dashboard for status.');
    }

    function updateStatus(poleId) {
        // Check if currentWorker is logged in before proceeding
        if (!currentWorker) {
            showMessage("Error: Worker details not found. Please log in again.");
            logout();
            return;
        }
        
        // Find complaint using the Pole ID (which is now correctly passed as a string)
        const complaint = complaints.find(c => c.poleId === poleId);
        
        if (complaint) {
            if (complaint.status === 'New') {
                // If new, prompt for a date and assign to the current worker
                // NOTE: Assignment logic is now also included here for completeness, 
                // in case the worker starts work on an unassigned job.
                if (!complaint.assignedTo) {
                    complaint.assignedTo = currentWorker.workerId;
                }
                showDatePrompt(complaint.id);
            } else if (complaint.status === 'In Progress') {
                // If in progress, mark as completed
                complaint.status = 'Completed';
                showMessage(`Complaint for Pole ID ${complaint.poleId} is now Completed.`);
                saveState();
                renderWorkerDashboard();
            }
        }
    }

    function showDatePrompt(reportId) {
        const modal = document.createElement('div');
        modal.className = "fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center p-4 z-50";
        modal.innerHTML = `
            <div class="card w-full max-w-sm">
                <h3 class="text-xl font-extrabold mb-4 text-center">Set Estimated Repair Date</h3>
                <form id="date-form">
                    <div class="space-y-2 mb-4">
                        <label for="estimatedDate" class="block text-sm font-bold text-gray-700">Select Date</label>
                        <input type="date" id="estimatedDate" class="form-input" required>
                    </div>
                    <div class="flex space-x-2">
                        <button type="button" id="cancel-date-btn" class="btn btn-secondary flex-1 py-2 text-base">Cancel</button>
                        <button type="submit" class="btn btn-primary flex-1 py-2 text-base">Set Date</button>
                    </div>
                </form>
            </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('cancel-date-btn').addEventListener('click', () => {
            modal.remove();
        });

        document.getElementById('date-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const dateInput = document.getElementById('estimatedDate');
            const estimatedDate = dateInput.value;
            
            const complaint = complaints.find(c => c.id === reportId);
            if (complaint) {
                complaint.status = 'In Progress';
                complaint.estimatedDate = estimatedDate;
                saveState();
                showMessage(`Repair for Pole ID ${complaint.poleId} is now In Progress. Est. Date: ${estimatedDate}`);
                modal.remove();
                renderWorkerDashboard();
            }
        });
    }

    function showAssignModal(reportId, event) {
        event.stopPropagation(); // Prevent li click
        const modal = document.createElement('div');
        modal.className = "fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center p-4 z-50";
        modal.innerHTML = `
            <div class="card w-full max-w-sm">
                <h3 class="text-xl font-extrabold mb-4 text-center">Assign Report to a Worker</h3>
                <div class="space-y-4">
                    ${workers.map(w => `
                        <button onclick="assignWork(${reportId}, '${w.workerId}')" class="btn btn-primary w-full py-2 text-base">${w.workerId}</button>
                    `).join('')}
                </div>
                <button onclick="document.body.removeChild(this.closest('.fixed'))" class="btn btn-secondary w-full mt-4 py-2 text-base">Cancel</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    function assignWork(reportId, workerId) {
        const report = [...complaints, ...requests].find(r => r.id === reportId);
        if (report) {
            report.assignedTo = workerId;
            // Set default priority if it doesn't exist (only needed for older reports)
            if (!report.priority) {
                report.priority = 'Low';
            }
            saveState();
            showMessage(`Report assigned to Worker ${workerId}`);
            renderAuthorityDashboard();
            // Remove the modal
            document.body.removeChild(document.querySelector('.fixed'));
        }
    }


    function showMessage(message) {
        // A simple message box instead of an alert()
        const messageBox = document.createElement('div');
        messageBox.className = "fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 text-sm opacity-0 transition-opacity duration-300";
        messageBox.textContent = message;
        document.body.appendChild(messageBox);
        setTimeout(() => messageBox.style.opacity = '1', 10); // Fade in
        setTimeout(() => messageBox.style.opacity = '0', 3000); // Fade out
        setTimeout(() => messageBox.remove(), 3500);
    }

    // --- Initial App Render ---
    function renderApp() {
        // This is the key fix: clear the container first
        appContainer.innerHTML = '';
        
        if (isLoggedIn) {
            if (userRole === 'citizen') {
                // Ensure currentCitizen is not null before rendering dashboard
                if (currentCitizen) {
                    renderCitizenDashboard();
                } else {
                    showMessage("Error: Citizen user data missing. Logging out.");
                    logout();
                }
            } else if (userRole === 'worker') {
                // Ensure currentWorker is not null before rendering dashboard
                if (currentWorker) {
                    renderWorkerDashboard();
                } else {
                    showMessage("Error: Worker user data missing. Logging out.");
                    logout();
                }
            } else if (userRole === 'authority') {
                // Ensure currentAuthority is not null before rendering dashboard
                if (currentAuthority) {
                    renderAuthorityDashboard();
                } else {
                    showMessage("Error: Authority user data missing. Logging out.");
                    logout();
                }
            }
        } else {
            // If a role is selected but not logged in, render the login form.
            if (userRole === 'citizen') {
                renderCitizenLoginForm();
            } else if (userRole === 'worker') {
                renderWorkerLoginForm();
            } else if (userRole === 'authority') {
                renderAuthorityLoginForm();
            } else {
                 // If no role is selected, render the main login page.
                renderLoginPage();
            }
        }
    }

    // Load initial view
    window.onload = renderApp; // Use window.onload to ensure all DOM elements are loaded before rendering
</script>

</body>
